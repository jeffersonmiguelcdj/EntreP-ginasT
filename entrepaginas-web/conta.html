<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EntrePáginas · Minha conta</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Cabeçalho: logo, menu Categorias, busca, carrinho e conta -->
  <header class="topo">
    <div class="container topo__barra">
      <a href="index.html" class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>
        EntrePáginas
      </a>
      <div class="menu-cat" id="menu-cat">
        <button class="menu-cat__botao" type="button" aria-expanded="false" aria-controls="painel-cat">
          Categorias
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="menu-cat__painel" id="painel-cat">
          <div class="container menu-cat__conteudo">
            <div>
              <h3>Explorar</h3>
              <ul>
                <li><a href="catalogo.html">Todos os livros</a></li>
                <li><a href="catalogo.html?ordem=recentes">Novidades</a></li>
                <li><a href="catalogo.html?ordem=menor">Menores preços</a></li>
              </ul>
            </div>
            <div>
              <h3>Categorias</h3>
              <ul class="menu-cat__lista" id="lista-categorias"></ul>
            </div>
          </div>
        </div>
      </div>
      <form class="busca" action="catalogo.html" method="get" role="search">
        <input type="search" name="q" placeholder="Buscar por título ou autor" aria-label="Buscar">
        <button type="submit" aria-label="Buscar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        </button>
      </form>
      <nav class="acoes">
        <a href="carrinho.html" class="icone-btn" aria-label="Carrinho">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
          <span id="contador-carrinho" class="contador oculto">0</span>
        </a>
        <a href="login.html" class="icone-btn" id="link-conta" aria-label="Minha conta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        </a>
      </nav>
    </div>
  </header>
  <!-- Conteúdo da página -->
  <main class="container">
    <div class="painel__titulo" style="margin-top:32px">
      <div class="cabecalho-pagina" style="padding:0"><h1 id="ola"></h1><p>Acompanhe seus empréstimos, multas e compras.</p></div>
      <button class="btn btn--contorno btn--peq" id="sair">Sair</button>
    </div>
    <div class="resumo" id="resumo"></div>
    <div class="abas-conteudo" id="abas">
      <button data-aba="emprestimos" class="ativo">Empréstimos</button>
      <button data-aba="multas">Multas</button>
      <button data-aba="compras">Compras</button>
    </div>
    <div class="tabela-caixa" style="margin-bottom:72px"><table class="tabela" id="tabela"></table></div>
  </main>
  <!-- Rodapé -->
  <footer class="rodape">
    <div class="container">
      <span>© 2026 EntrePáginas · Empréstimo e venda de livros</span>
      <span>Retirada e devolução de empréstimos no balcão</span>
    </div>
  </footer>
  <!-- Arquivos JS usados por todas as páginas (a ordem importa) -->
  <script src="js/config.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/banco.js"></script>
  <script src="js/app.js"></script>
  <!-- Código desta página -->
  <script>
    // Página só de cliente. Sem login (ou funcionário), vai para o login.
    const sessao = Sessao.atual();
    if (!sessao || sessao.tipo !== "Cliente") window.location.href = "login.html?voltar=conta.html";
    else {
      const banco = Banco.ler();
      // Empréstimos e vendas apontam para o exemplar; o título está no livro do exemplar.
      const tituloDoExemplar = idExemplar => {
        const exemplar = banco.exemplares.find(exemplar => exemplar.id_exemplar === idExemplar);
        return banco.livros.find(livro => livro.id_livro === exemplar.id_livro).titulo;
      };
      // Listas do cliente, das mais novas para as mais antigas.
      const emprestimos = EmprestimoDAO.doCliente(sessao.id).sort((primeiro, segundo) => segundo.id_emprestimo - primeiro.id_emprestimo);
      const multas = MultaDAO.doCliente(sessao.id);
      const compras = VendaDAO.doCliente(sessao.id).sort((primeira, segunda) => segunda.id_venda - primeira.id_venda);
      const estaAtrasado = emprestimo => emprestimo.status === "Em Andamento" && emprestimo.data_prevista_devolucao < dataDeHoje();

      // Saudação e quadros de resumo.
      document.getElementById("ola").textContent = `Olá, ${sessao.nome.split(" ")[0]}`;
      const totalDeMultasPendentes = multas
        .filter(multa => multa.status === "Pendente")
        .reduce((soma, multa) => soma + multa.valor, 0);
      document.getElementById("resumo").innerHTML = `
        <div class="resumo__item"><span>Empréstimos ativos</span><strong>${emprestimos.filter(emprestimo => emprestimo.status === "Em Andamento").length}</strong></div>
        <div class="resumo__item"><span>Em atraso</span><strong>${emprestimos.filter(estaAtrasado).length}</strong></div>
        <div class="resumo__item"><span>Multas pendentes</span><strong>${formatarPreco(totalDeMultasPendentes)}</strong></div>
        <div class="resumo__item"><span>Compras</span><strong>${compras.length}</strong></div>`;

      // Linha que aparece quando a tabela não tem nada.
      const linhaVazia = (colunas, texto) => `<tr><td colspan="${colunas}" class="vazio">${texto}</td></tr>`;

      // Situação do empréstimo em forma de etiqueta colorida.
      function etiquetaDoEmprestimo(emprestimo) {
        if (estaAtrasado(emprestimo)) return '<span class="etiqueta etiqueta--alerta">Atrasado</span>';
        if (emprestimo.status === "Em Andamento") return '<span class="etiqueta etiqueta--info">Com você</span>';
        return '<span class="etiqueta">Devolvido</span>';
      }

      // Uma função para montar cada aba (Empréstimos, Multas, Compras).
      const montarTabela = {
        emprestimos: () => `<thead><tr><th>Livro</th><th>Retirada</th><th>Devolver até</th><th>Devolvido em</th><th>Situação</th></tr></thead><tbody>` +
          (emprestimos.map(emprestimo => `<tr>
            <td>${tituloDoExemplar(emprestimo.id_exemplar)}</td>
            <td>${formatarData(emprestimo.data_emprestimo)}</td>
            <td>${formatarData(emprestimo.data_prevista_devolucao)}</td>
            <td>${formatarData(emprestimo.data_devolucao)}</td>
            <td>${etiquetaDoEmprestimo(emprestimo)}</td></tr>`).join("") || linhaVazia(5, "Nenhum empréstimo ainda.")) + "</tbody>",

        multas: () => `<thead><tr><th>Livro</th><th>Gerada em</th><th>Valor</th><th>Pago em</th><th>Situação</th></tr></thead><tbody>` +
          (multas.map(multa => {
            const emprestimo = banco.emprestimos.find(emprestimo => emprestimo.id_emprestimo === multa.id_emprestimo);
            return `<tr>
            <td>${tituloDoExemplar(emprestimo.id_exemplar)}</td>
            <td>${formatarData(multa.data_geracao)}</td>
            <td>${formatarPreco(multa.valor)}</td>
            <td>${formatarData(multa.data_pagamento)}</td>
            <td>${multa.status === "Pendente" ? '<span class="etiqueta etiqueta--alerta">Pendente</span>' : '<span class="etiqueta etiqueta--ok">Paga</span>'}</td></tr>`;
          }).join("") || linhaVazia(5, "Você não tem multas.")) + "</tbody>",

        compras: () => `<thead><tr><th>Pedido</th><th>Data</th><th>Livros</th><th>Pagamento</th><th>Total</th></tr></thead><tbody>` +
          (compras.map(venda => `<tr>
            <td>#${venda.id_venda}</td>
            <td>${formatarData(venda.data_venda)}</td>
            <td>${VendaDAO.itensDaVenda(venda.id_venda).map(item => tituloDoExemplar(item.id_exemplar)).join(", ")}</td>
            <td>${FORMAS_PAGAMENTO.find(forma => forma.id_forma_pagamento === venda.id_forma_pagamento).tipo}</td>
            <td>${formatarPreco(venda.valor_total)}</td></tr>`).join("") || linhaVazia(5, "Nenhuma compra ainda.")) + "</tbody>"
      };

      // Marca a aba clicada e troca a tabela.
      function abrirAba(aba) {
        document.querySelectorAll("#abas button").forEach(botao => botao.classList.toggle("ativo", botao.dataset.aba === aba));
        document.getElementById("tabela").innerHTML = montarTabela[aba]();
      }
      document.getElementById("abas").addEventListener("click", evento => evento.target.dataset.aba && abrirAba(evento.target.dataset.aba));
      document.getElementById("sair").addEventListener("click", () => { Sessao.sair(); window.location.replace("index.html"); });

      // Depois de uma compra, o carrinho manda para conta.html?aba=compras&nova=ID.
      abrirAba(lerParametroDaUrl("aba") || "emprestimos");
      if (lerParametroDaUrl("nova")) mostrarAviso("Compra realizada com sucesso!");
    }
  </script>
</body>
</html>
